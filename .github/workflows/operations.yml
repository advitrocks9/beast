name: Operations

on:
  schedule:
    # Uptime + orchestrator sweep every 15 minutes; nightly demo reset at 09:00 UTC.
    - cron: "*/15 * * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEMO_URL: https://beast-demo.vercel.app

jobs:
  uptime:
    name: uptime + tick
    if: github.event.schedule != '0 9 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Demo loads
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -L "$DEMO_URL/dashboard")"
          if [ "$code" != "200" ]; then
            echo "::error::$DEMO_URL/dashboard returned $code"; exit 1
          fi

      - name: Health endpoint
        run: |
          body="$(curl -s "$DEMO_URL/api/health")"
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::health check failed"; exit 1; }

      - name: Orchestrator tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not set; skipping tick"; exit 0
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$DEMO_URL/api/cron/tick")"
          [ "$code" = "200" ] || { echo "::error::tick returned $code"; exit 1; }

  demo-reset:
    name: nightly demo reset
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reset seed and purge visitor sessions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not configured"; exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "$DEMO_URL/api/cron/demo-reset")"
          [ "$code" = "200" ] || { echo "::error::demo reset returned $code"; exit 1; }
