name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Only ship on a green CI run (or a manual dispatch).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build & deploy to Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Require deploy secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          [ -z "${VERCEL_TOKEN}" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${DATABASE_URL}" ] && missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Deploy secrets not configured:$missing"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@48

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Migrations run before build/deploy and fail the run on any unhealthy
      # path (unreachable host, drift, real failure) so code never ships
      # against a schema the migration never reached.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @beast/db db:migrate-or-skip

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact (production)
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Post-deploy health check
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url/api/health")"
            [ "$code" = "200" ] && echo "healthy" && exit 0
            echo "attempt $i: /api/health returned $code"; sleep 15
          done
          echo "::error::Deployed app failed its health check"; exit 1

      - name: Scrub pulled env files
        if: always()
        run: rm -f .vercel/.env.*.local
