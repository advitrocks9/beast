name: Deploy Workers (Trigger.dev)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRIGGER_PROJECT_ID: ${{ secrets.TRIGGER_PROJECT_ID }}
  TRIGGER_CLI_VERSION: 4.4.3

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Deploy harness + workers to Trigger.dev (PROD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

    steps:
      - name: Require TRIGGER_ACCESS_TOKEN
        run: |
          if [ -z "${TRIGGER_ACCESS_TOKEN}" ]; then
            echo "::error::TRIGGER_ACCESS_TOKEN secret not set. Create a PAT at"
            echo "https://cloud.trigger.dev/account/personal-access-tokens and add"
            echo "it to repo secrets, or disable this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Trigger.dev (PROD)
        working-directory: apps/workers
        run: |
          npx -y trigger.dev@${{ env.TRIGGER_CLI_VERSION }} deploy \
            --project-ref="${{ env.TRIGGER_PROJECT_ID }}"
